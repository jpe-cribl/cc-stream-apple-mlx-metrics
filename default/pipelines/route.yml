id: default
groups: {}
comments: []
routes:
  - id: mlx_metrics
    name: MLX Metrics
    final: true
    disabled: false
    pipeline: mlx_metrics_normalize
    description: Process MLX metrics.
    enableOutputExpression: false
    targetContext: group
    filter: "sourcetype=='mlx:metrics'"
    clones: []
    output: __group
  - id: macmon_metrics
    name: MacMon Metrics
    final: true
    disabled: false
    pipeline: mlx_metrics_normalize
    description: Process MacMon Prometheus metrics.
    enableOutputExpression: false
    targetContext: group
    filter: "job=='macmon'"
    clones: []
    output: __group
  - id: default
    name: default
    final: true
    disabled: true
    pipeline: drop_unmatched
    description: Disabled so events no earlier route consumed are dropped, not forwarded by the implicit catch-all route.
    enableOutputExpression: false
    targetContext: group
    filter: "true"
    clones: []
    output: __group
