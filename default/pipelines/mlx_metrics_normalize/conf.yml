streamtags: []
groups: {}
asyncFuncTimeout: 1000
description: >-
  Normalizes MLX and MacMon samples, stamps the Splunk metrics index, and
  publishes named metrics and the listed node host fields as native metrics.
functions:
  - id: drop
    filter: "sourcetype !== 'mlx:metrics' && job !== 'macmon'"
    disabled: false
  - id: eval
    filter: "job === 'macmon' && __name__ !== undefined"
    disabled: false
    conf:
      add:
        - name: _metric
          value: __name__
        - name: host
          value: "(host || instance || 'macmon').replace(/:\\d+$/, '')"
        - name: source
          value: "'macmon'"
        - name: sourcetype
          value: "'prometheus:metrics'"
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: index
          value: C.vars.splunk_metrics_index
  # A non-finite value (a Prometheus staleness marker) is no sample, so drop it.
  - id: drop
    filter: "_metric !== undefined && !Number.isFinite(Number(_value))"
    disabled: false
  - id: eval
    filter: "_metric !== undefined"
    disabled: false
    conf:
      add:
        - name: _value
          value: Number(_value)
  - id: publish_metrics
    filter: "_metric !== undefined"
    disabled: false
    conf:
      metricNameField: _metric
      valueField: _value
      dimensions:
        - "*"
  - id: publish_metrics
    filter: "_metric === undefined"
    disabled: false
    conf:
      dimensions:
        - host
      fields:
        - inFieldName: node_load1
          metricType: gauge
        - inFieldName: node_load5
          metricType: gauge
        - inFieldName: node_load15
          metricType: gauge
        - inFieldName: node_memory_used_bytes
          metricType: gauge
        - inFieldName: node_memory_used_percent
          metricType: gauge
        - inFieldName: node_memory_swap_used_bytes
          metricType: gauge
        - inFieldName: node_cpu_percent_active_all
          metricType: gauge
